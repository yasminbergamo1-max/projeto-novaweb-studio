<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form id="Login">
        <div class="container">
            <h1>Login</h1>
        </div>
        <div class="container">
           <label>E-mail</label>
           <input type="email" name="email" id="email"> 
        </div>
        <div class="container">
            <label>Senha</label>
            <input type="password" name="senha" id="senha">
        </div>
        <div class="container">
            <button type="submit">Entrar</button>
        </div>
        <div class="container">
            <a href="=#">Cadastre-se</a>
        </div>
        <div class="container">
            <a href="#">Esqueci minha senha</a>
        </div>
        <p id="mensagem"></p>
    </form>
     <script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="perfil.css">
<body>
    <header>
        <h1>Bem-vindo ao Perfil</h1>
    </header>
    <main>
        <form class="form">
            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;"></div>

            <div>
                <img src="Gato velho.jpg" alt="Foto de Perfil" width="150" onmouseover="console.log('Mouse sobre a imagem')">
            </div>

            <div class="form-group">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome">
            </div>

            <div class="form-group">
                <label for="nascimento" class="form-label">Nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento" value="2009-08-05">
            </div>

            <div class="form-group">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" value="Seu CPF" onblur="validaCPF()">
            </div>

            <div class="form-group">
                <label>Gênero:</label>
                <input type="radio" name="genero" value="Feminino" required>Feminino
                <input type="radio" name="genero" value="Masculino">Masculino
                <input type="radio" name="genero" value="Outro">Outro
            </div>

            <div class=" form-group">
                <label>Interesses:</label>
                <input type="checkbox" name="Interesses" vale="Livros">Livros
                <input type="checkbox" name="Interesses" vale="Jogos">Jogos
                <input type="checkbox" name="Interesses" vale="Música">Música
            </div>

            <div class="form-group">
                <label for="cidade">Cidade:</label>
                <select class="form-control" id="cidade" name="cidade" required>
                    <option value="">Selecione o seu nível escolar</option>
                    <option value="Ensino Fundamental">Ensino Fundamental</option>
                    <option value="Ensino Médio">Ensino Médio</option>
                    <option value="Ensino Superior">Ensino Superior</option>
                    <option value="Pós-Graduação">Pós-Graduação</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sobre">Sobre Mim:</label>
                <textarea class="form-control" id="sobre" name="sobre" rows="3"></textarea>
            </div>

            <div class="form-group">
                <button type="button" onclick="mensagem()" btn btn-primary>Salvar</button>
            </div>
        </form>
    </main>
    <script type="text/JavaScript">
        function mensagem() {
            const msg = document.querySelector('#mensagem');
            msg.style.display = 'block';
            msg.textContent = 'Perfil salvo com sucesso!!';
        }

        function validaCPF() {
            const cpf = document.querySelector('#cpf').value;
            //Implement CPF validation logic here
            console.log(cpf);
            if (cpf.length !== 11) {
              const msg = document.querySelector('#mensagem');
              msg.style.display = 'block';
              msg.textContent = 'CPF inválido. Deve conter 11 dígitos.000,,';
        }
        }

        document.querySelector('#formPerfil').addEventListener('submit', function(event) { 
            event.preventDefault(); 
            const cpf = document.querySelector('#cpf').value.replace(/\D/g, ''); 
            if (cpf.length !== 11) { 
                validaCPF(); 
            } 
                else { mensagem(); 

                } 
            }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    </head>
<body>
    <header>
        <h1>Bem-vindo ao Perfil</h1>
    </header>
    <main>
        <form class="form">
            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;"></div>

            <div>
                <img src="Gato velho.jpg" alt="Foto de Perfil" width="150" onmouseover="console.log('Mouse sobre a imagem')">
            </div>

            <div class="form-group">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="nascimento" class="form-label">Nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento" required>
            </div>

            <div class="form-group">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" value="Seu CPF" onblur="validaCPF()" required>
            </div>

            <div class="form-group">
                <label>Gênero:</label><br>
                <input type="radio" name="genero" value="Feminino" required>Feminino<br>
                <input type="radio" name="genero" value="Masculino">Masculino<br>
                <input type="radio" name="genero" value="Outro">Outro<br>
            </div>

            <div class=" form-group">
                <label>Interesses:</label><br>
                <input type="checkbox" name="Interesses" vale="Livros">Livros<br>
                <input type="checkbox" name="Interesses" vale="Jogos">Jogos<br>
                <input type="checkbox" name="Interesses" vale="Música">Música<br>
            </div>

            <div class="form-group">
                <label for="cidade">Nível Escolar:</label>
                <select class="form-control" id="nivel" name="nivel" required>
                    <option value="">Selecione o seu nível escolar</option>
                    <option value="Ensino Fundamental">Ensino Fundamental</option>
                    <option value="Ensino Médio">Ensino Médio</option>
                    <option value="Ensino Superior">Ensino Superior</option>
                    <option value="Pós-Graduação">Pós-Graduação</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sobre">Sobre Mim:</label>
                <textarea class="form-control" id="sobre" name="sobre" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <button type="button" onclick="mensagem()">Salvar</button>
        </form>
    </main>
    <script type="text/JavaScript">
        function mensagem() {
            const msg = document.querySelector('#mensagem');
            const cpf = document.querySelector('#cpf').value.replace(/\D/g, '');
            if (cpf.length !== 11) { 
                validaCPF(); 
            } 
            else { 
                msg.className = 'alert alert-success'; 
                msg.style.display = 'block'; 
                msg.textContent = 'Perfil salvo com sucesso!';
        }
    }

        function validaCPF() {
           const cpf = document.querySelector('#cpf').value.replace(/\D/g, '');
           const msg = document.querySelector('#mensagem');
            //Implement CPF validation logic here
            if (cpf.length !== 11) {
              msg.className = 'alert alert-danger';
              msg.style.display = 'block';
              msg.textContent = 'CPF inválido. Deve conter 11 dígitos.000,,';
            }
            else {
                msg.style.display = 'none'; 
    }
        }

        const nascimento = document.querySelector('#nascimento');

    const hoje = new Date();
    const dataMaxima = hoje.toISOString().split('T')[0];

    const dataMinima = new Date();
    dataMinima.setFullYear(dataMinima.getFullYear() - 120);
    const dataMinimaFormatada = dataMinima.toISOString().split('T')[0];

    nascimento.min = dataMinimaFormatada;
    nascimento.max = dataMaxima;

    function mensagem() {
        const msg = document.querySelector('#mensagem');
        const nome = document.querySelector('#nome').value.trim();
        const cpf = document.querySelector('#cpf').value.replace(/\D/g, '');
        const data = nascimento.value;
        const nivel = document.querySelector('#nivel').value;
        const sobre = document.querySelector('#sobre').value.trim();
        const genero = document.querySelector('input[name="genero"]:checked');
        const interesses = document.querySelectorAll('input[name="Interesses"]:checked');

        msg.style.display = 'block';
        msg.className = 'alert alert-danger';

        if (nome === '') {
            msg.textContent = 'Preencha o campo Nome.';
        } else if (data === '') {
            msg.textContent = 'Preencha a data de nascimento.';
        } else if (data < dataMinimaFormatada || data > dataMaxima) {
            msg.textContent = 'A data de nascimento é inválida.';
        } else if (cpf.length !== 11) {
            msg.textContent = 'CPF inválido. Deve conter 11 números.';
        } else if (!genero) {
            msg.textContent = 'Selecione uma opção de gênero.';
        } else if (interesses.length === 0) {
            msg.textContent = 'Selecione pelo menos um interesse.';
        } else if (nivel === '') {
            msg.textContent = 'Selecione seu nível escolar.';
        } else if (sobre === '') {
            msg.textContent = 'Preencha o campo Sobre Mim.';
        } else {
            msg.className = 'alert alert-success';
            msg.textContent = 'Perfil salvo com sucesso!';
        }
    }

    function validaCPF() {
        const cpf = document.querySelector('#cpf').value.replace(/\D/g, '');
        const msg = document.querySelector('#mensagem');

        if (cpf !== '' && cpf.length !== 11) {
            msg.style.display = 'block';
            msg.className = 'alert alert-danger';
            msg.textContent = 'CPF inválido. Deve conter 11 números.';
        }
    }
    </script>
</body>
</html>
